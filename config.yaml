categories: ["cs.CV", "physics.optics", "physics.ins-det", "eess.IV"]

keywords:
  - "diameter measurement"
  - "laser triangulation"
  - "surface roughness"
  - "dimensional measurement"
  - "structured light"
  - "profilometry"
  - "wheelset"

exclude_keywords: []

logic: "AND"
max_results: 40
sort_by: "lastUpdatedDate"
sort_order: "descending"

lang: "both"

summary:
  mode: "llm"
  scope: "tldr"

llm:
  provider: "openai-compatible"
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"
  api_key_env: "OPENAI_COMPAT_API_KEY"

translate:
  enabled: true
  lang: "zh"
  fields: ["title", "summary"]

email:
  enabled: true
  subject: "[arXiv] 测量方向每日速递"
  smtp_server: "smtp.qq.com"
  smtp_port: 465
  tls: "ssl"
  debug: false
  detail: "full"
  max_items: 10
  attach_md: true
  attach_pdf: false

site:
  enabled: true
  dir: "docs"
  title: "测量方向论文速递"
  keep_runs: 1024
  theme: "light"
  accent: "#2563eb"

freshness:
  since_days: 7
  unique_only: true
  state_path: ".state/seen.json"
  fallback_when_empty: false
