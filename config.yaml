# === 检索 ===
categories: ["cs.CV", "physics.optics", "physics.ins-det", "eess.IV", "cs.RO"]
keywords:
  - "dimensional measurement"
  - "diameter measurement"
  - "laser triangulation"
  - "surface roughness measurement"
  - "industrial metrology"
  - "speckle"
  - "structured light"
  - "fringe projection"
  - "deflectometry"
  - "profilometry"
  - "on-machine measurement"
  - "in-process measurement"
  - "machine vision inspection"
  - "railway wheel"
  - "wheelset"
  - "3D reconstruction point cloud"
  - "uncertainty measurement GUM"
exclude_keywords:
  - "Large Language Model"
  - "Generative AI"
  - "LLM agent"
  - "text-to-image"
  - "diffusion model"
logic: "AND"
max_results: 40
sort_by: "lastUpdatedDate"
sort_order: "descending"

# === 输出语言 ===
lang: "both"

# === 摘要生成 ===
summary:
  mode: "llm"
  scope: "tldr"

# === LLM（DeepSeek）===
llm:
  provider: "openai-compatible"
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"
  api_key_env: "OPENAI_COMPAT_API_KEY"
  system_prompt_en: |
    You are a senior paper-reading assistant...
  system_prompt_zh: |
    你是资深论文阅读助手...

# === 中文翻译 ===
translate:
  enabled: true
  lang: "zh"
  fields: ["title", "summary"]

# === 邮件 ===
email:
  enabled: true
  subject: "[arXiv] 测量方向每日速递"
  smtp_server: "smtp.qq.com"
  smtp_port: 465
  tls: "ssl"
  debug: false
  detail: "full"
  max_items: 10
  attach_md: true
  attach_pdf: false

# === 站点（GitHub Pages）===
site:
  enabled: true
  dir: "docs"
  title: "测量方向论文速递"
  keep_runs: 1024
  theme: "light"
  accent: "#2563eb"

# === 新鲜度 & 去重 ===
freshness:
  since_days: 7
  unique_only: true
  state_path: ".state/seen.json"
  fallback_when_empty: false
