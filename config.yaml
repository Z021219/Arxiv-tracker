categories: ["physics.optics", "eess.IV", "physics.ins-det"]

keywords:
  # —— 测量对象 ——
  - "wheel diameter measurement"
  - "railway wheel"
  - "wheelset"
  - "roundness measurement"
  - "circularity measurement"
  - "cylindricity"
  # —— 测量手段 ——
  - "laser triangulation"
  - "laser displacement sensor"
  - "displacement sensor"
  - "profilometry"
  - "on-machine measurement"
  - "in-process measurement"
  # —— 误差机理 ——
  - "speckle"
  - "surface roughness measurement"
  - "eccentricity measurement"
  - "error separation"
  - "circle fitting"
  # —— 不确定度与溯源 ——
  - "measurement uncertainty"
  - "GUM"
  - "calibration"

exclude_keywords:
  - "exoplanet"
  - "orbit"
  - "astronomy"
  - "adaptive optics"
  - "turbulence"
  - "blood"
  - "tissue"
  - "biomedical"
  - "in vivo"
  - "quantum"
  - "single-photon"
  - "fluorescence"
  - "neural network"
  - "deep learning"
  - "generative"
  - "diffusion model"
  - "large language model"
  - "super-resolution"

logic: "OR"
max_results: 30
sort_by: "relevance"
sort_order: "descending"

lang: "both"

summary:
  mode: "llm"
  scope: "tldr"

llm:
  provider: "openai-compatible"
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"
  api_key_env: "OPENAI_COMPAT_API_KEY"

translate:
  enabled: true
  lang: "zh"
  fields: ["title", "summary"]

email:
  enabled: true
  subject: "[arXiv] 车轮测量与光学计量"
  smtp_server: "smtp.qq.com"
  smtp_port: 465
  tls: "ssl"
  debug: false
  detail: "full"
  max_items: 10
  attach_md: true
  attach_pdf: false

site:
  enabled: true
  dir: "docs"
  title: "车轮测量与光学计量"
  keep_runs: 1024
  theme: "light"
  accent: "#2563eb"

freshness:
  since_days: 3
  unique_only: true
  state_path: ".state/seen.json"
  fallback_when_empty: false
